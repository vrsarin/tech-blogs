<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link rel="canonical" href="{{ page.canonical_url | absolute_url }}" />
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #242424;
        font-family: Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 20px;
        line-height: 1.58;
      }

      .medium-article {
        max-width: 700px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }

      h1,
      h2,
      h3 {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.2;
      }

      h1 {
        font-size: 2.4rem;
        margin: 0 0 2rem;
      }

      h2 {
        font-size: 1.75rem;
        margin-top: 3rem;
      }

      h3 {
        font-size: 1.35rem;
        margin-top: 2rem;
      }

      p,
      ul,
      ol,
      blockquote {
        margin-bottom: 1.4rem;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      .medium-equation {
        margin: 1.6rem 0;
        text-align: center;
      }

      .medium-equation img {
        display: inline-block;
        max-width: 100%;
        vertical-align: middle;
      }

      .medium-inline-equation {
        display: inline-block;
        max-height: 1.4em;
        vertical-align: -0.25em;
      }

      code,
      pre {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main class="medium-article">{{ content }}</main>
  </body>
</html>
